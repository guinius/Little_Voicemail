# Captive-portal DNS for the Little Voicemail setup access point.
#
# NetworkManager runs a dnsmasq for connections in shared mode and reads
# extra settings from this directory. Resolving every name to the Pi is what
# makes a phone notice the network is captive and pop the "Sign in" sheet on
# its own, instead of the parent having to know an IP address to type.
#
# This only ever applies to NetworkManager's own shared-mode instance, which
# exists solely while the setup hotspot is up.
address=/#/10.42.0.1
