{% extends "base.html" %}
{% block title %}Sign in &middot; Little Voicemail{% endblock %}

{% block content %}
<div class="login-wrap">
  <h1>Little Voicemail</h1>
  <div class="card">
    <form method="post">
      <label for="password">Parent password</label>
      <input type="password" id="password" name="password" autocomplete="current-password"
             autofocus required>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <p class="hint" style="text-align:center;margin-top:.9rem">
    Seeing a security warning? <a href="{{ url_for('certificate_page') }}">Install this device's certificate</a> to remove it for good.
  </p>
</div>
{% endblock %}
